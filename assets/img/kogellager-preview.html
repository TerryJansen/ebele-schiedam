<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kogellager animatie — preview</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(circle at 50% 35%, #14181e, #05070a 70%);font-family:Inter,sans-serif;color:#c9d2db}
  .lager{width:min(70vw,420px);height:auto;filter:drop-shadow(0 24px 40px rgba(0,0,0,.55));transition:transform .3s}
  .lager:hover{transform:scale(1.04)}
  .varianten{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
  .varianten .lager{width:150px}
  p{margin:0;font-size:13px;opacity:.65}
</style>
</head>
<body>
  <img class="lager" src="kogellager.svg" alt="Kogellager animatie">
  <p>1050px breed en kleiner blijft hij haarscherp (vector). Draaisnelheid aan te passen via de dur="14s" in de SVG.</p>
  <div class="varianten">
    <img class="lager" src="kogellager.svg" alt="">
    <img class="lager" src="kogellager.svg" alt="">
    <img class="lager" src="kogellager.svg" alt="">
  </div>
</body>
</html>
